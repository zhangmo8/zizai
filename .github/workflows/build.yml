name: release-build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to package, for example v1.2.0'
        required: true
        type: string

# 只有版本 tag 打包并创建 Release / update.json；普通 commit 只跑 ci.yml。
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  R2_BUCKET: zizai-releases          # ← 改成你的 R2 桶名
  R2_RELEASES_PREFIX: releases       # R2 里的目录前缀

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected version tag like v1.2.0, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify version tag exists
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status === 404) {
                throw new Error(
                  `Version tag "${tag}" does not exist on origin. ` +
                  `Create and push it, then rerun the release: ` +
                  `git tag ${tag} && git push origin ${tag}`,
                );
              }
              throw error;
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Verify pubspec version matches tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          app_version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          tag_version="${TAG#v}"
          if [[ "${app_version}" != "${tag_version}" ]]; then
            echo "pubspec version ${app_version} does not match tag ${TAG}" >&2
            exit 1
          fi

  # ────────────────────────────────────────────
  #  以下 R2 上传步骤统一使用 env 传递密钥：
  #    AWS_ACCESS_KEY_ID     ← secrets.R2_ACCESS_KEY_ID
  #    AWS_SECRET_ACCESS_KEY ← secrets.R2_SECRET_ACCESS_KEY
  #    R2_ENDPOINT           ← secrets.R2_ACCOUNT_ID 拼接
  #  AWS CLI 已预装在 ubuntu/macos/windows runner 中。
  # ────────────────────────────────────────────

  android:
    name: Android APK
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.manifest.outputs.file }}
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - run: flutter pub get
      - name: Configure release signing (from secrets)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ZIZAI_ANDROID_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.ZIZAI_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ZIZAI_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ZIZAI_ANDROID_KEY_PASSWORD }}
        run: |
          # 稳定签名：keystore 经 base64 存在 GitHub secret，每次发布解出为固定文件，
          # 保证所有 release APK 签名一致（覆盖安装不再报「签名冲突」）。
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"
            # 诊断（不含敏感值）：与本地参照对比（2726 / 6a76cbbe... / 密码 24 / b64 3636）
            echo "diag: b64 len=${#KEYSTORE_B64} storepass len=${#KEYSTORE_PASSWORD} keypass len=${#KEY_PASSWORD} alias len=${#KEY_ALIAS}"
            echo "diag: decoded size=$(wc -c < "$RUNNER_TEMP/keystore/release.jks") md5=$(md5sum "$RUNNER_TEMP/keystore/release.jks" | cut -d' ' -f1)"
            echo "ZIZAI_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"
            echo "ZIZAI_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ZIZAI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            # PKCS12 语义下 key 密码与 keystore 密码同值。ZIZAI_KEY_PASSWORD
            # secret 曾被 gh 写入为空（诊断 keypass len=0，read key 解密失败），
            # 这里以 KEYSTORE_PASSWORD 兜底；网页端补填该 secret 后仍优先生效。
            echo "ZIZAI_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "warning: ZIZAI_ANDROID_KEYSTORE secret 未配置，release APK 将回退 debug 签名（更新会签名冲突）"
          fi
      - name: Build APK
        env:
          UPDATE_URL: ${{ secrets.R2_PUBLIC_BASE }}/update.json
        run: flutter build apk --release --dart-define=UPDATE_URL="${UPDATE_URL}"
      - id: manifest
        name: Compute sha256
        run: |
          sha=$(shasum -a 256 build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "file=app-release.apk" >> "$GITHUB_OUTPUT"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/app-release.apk
        run: |
          aws s3 cp build/app/outputs/flutter-apk/app-release.apk \
            "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

  macos:
    name: macOS .app
    needs: validate
    runs-on: macos-latest
    outputs:
      file: ${{ steps.manifest.outputs.file }}
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - run: flutter pub get
      - name: Build macOS
        env:
          UPDATE_URL: ${{ secrets.R2_PUBLIC_BASE }}/update.json
        run: flutter build macos --release --dart-define=UPDATE_URL="${UPDATE_URL}"
      - name: 打包 zip
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent zi_zai.app zizai-macos.zip
      - name: 打包安装向导 .pkg
        run: tool/installer/macos/build_pkg.sh
      - name: Upload installer pkg to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/zizai-macos.pkg
        run: |
          pkg=$(ls build/installer/zizai-*-macos.pkg)
          aws s3 cp "${pkg}" \
            "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress
      - id: manifest
        name: Compute sha256
        run: |
          sha=$(shasum -a 256 build/macos/Build/Products/Release/zizai-macos.zip | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "file=zizai-macos.zip" >> "$GITHUB_OUTPUT"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/zizai-macos.zip
        run: |
          aws s3 cp build/macos/Build/Products/Release/zizai-macos.zip \
            "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

  windows:
    name: Windows exe
    needs: validate
    runs-on: windows-latest
    outputs:
      file: ${{ steps.manifest.outputs.file }}
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        env:
          UPDATE_URL: ${{ secrets.R2_PUBLIC_BASE }}/update.json
        run: flutter build windows --release --dart-define=UPDATE_URL="${UPDATE_URL}"
      - name: 打包 zip
        run: |
          cd build/windows/x64/runner/Release
          powershell Compress-Archive -Path * -DestinationPath zizai-windows.zip
      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # NSIS 装到 C:\Program Files (x86)\NSIS，但不会自动进入后续步骤的
          # PATH；写入 GITHUB_PATH 让下一步 bash 能直接调用 makensis。
          $nsis = Get-ChildItem 'C:\Program Files*\NSIS\makensis.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw 'makensis.exe not found after choco install nsis' }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $nsis.FullName -Parent)
      - name: 打包安装向导 setup.exe
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          # Git Bash 会把 /DXXX= 这类参数当路径改写；禁用 MSYS2 参数转换，
          # 确保 makensis 收到原样的 /DAPP_VERSION=/DSOURCE=/DICON_SRC。
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          app_version="${TAG#v}"
          mkdir -p build/installer
          # 传绝对路径，避免 NSIS 对 Icon/File 相对路径的解析基准不一致
          # （Icon 按脚本目录、File 按工作目录）。/D 值不会被 MSYS2 改写。
          makensis \
            /DAPP_VERSION="${app_version}" \
            "/DSOURCE=${GITHUB_WORKSPACE}\build\windows\x64\runner\Release" \
            "/DICON_SRC=${GITHUB_WORKSPACE}\windows\runner\resources\app_icon.ico" \
            "/DOUT_DIR=${GITHUB_WORKSPACE}\build\installer" \
            tool/installer/windows/zi_zai_installer.nsi
      - name: Upload installer setup.exe to R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/zizai-windows-setup.exe
        run: |
          $exe = (Get-ChildItem 'build/installer/zizai-*-windows-setup.exe').FullName
          aws s3 cp $exe `
            "s3://$env:R2_BUCKET/$env:R2_KEY" `
            --endpoint-url "$env:R2_ENDPOINT" `
            --no-progress
      - id: manifest
        name: Compute sha256 (setup.exe)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem 'build/installer/zizai-*-windows-setup.exe').FullName
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          # 与上传步骤的 R2_KEY 保持一致（版本无关命名），否则 update.json /
          # 公开校验 URL 会 404。
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "file=zizai-windows-setup.exe" >> $env:GITHUB_OUTPUT
      - name: Upload to R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/zizai-windows.zip
        run: |
          aws s3 cp build/windows/x64/runner/Release/zizai-windows.zip `
            "s3://$env:R2_BUCKET/$env:R2_KEY" `
            --endpoint-url "$env:R2_ENDPOINT" `
            --no-progress

  release:
    name: GitHub Release + update.json
    needs: [validate, android, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          # changelog 需要完整历史与 tag（上一个版本 tag..HEAD 的提交）。
          fetch-depth: 0
      - name: Generate update.json (URLs point to R2)
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          ANDROID_FILE: ${{ needs.android.outputs.file }}
          ANDROID_SHA: ${{ needs.android.outputs.sha256 }}
          MACOS_FILE: ${{ needs.macos.outputs.file }}
          MACOS_SHA: ${{ needs.macos.outputs.sha256 }}
          WINDOWS_FILE: ${{ needs.windows.outputs.file }}
          WINDOWS_SHA: ${{ needs.windows.outputs.sha256 }}
        run: |
          # minDbSchema 从代码提取（lib/core/db.dart 的 minUpgradableSchemaVersion），
          # 不在工作流写死：其值 = 迁移链可升级的最老库版本（回放测试从 v1 空库逐级
          # 迁移到当前版本保证），不是 currentSchemaVersion——后者会把 v1–v3 老库
          # 用户拦在更新外（update.dart 守卫：minDbSchema > 本地库 → 拒绝更新）。
          export MIN_DB_SCHEMA=$(
            sed -n 's/^const int minUpgradableSchemaVersion = \([0-9]*\);.*/\1/p' \
              lib/core/db.dart
          )
          if [ -z "$MIN_DB_SCHEMA" ]; then
            echo "未从 lib/core/db.dart 提取到 minUpgradableSchemaVersion" >&2
            exit 1
          fi
          # changelog：上一个版本 tag..HEAD 的提交（一行一条，去掉 merge）。
          # 首个发布无前序 tag → 空串，客户端跳过弹窗。
          export CHANGELOG=""
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(
              git log --oneline --no-merges "${PREV_TAG}..HEAD" |
                sed 's/^/- /'
            )
          fi
          python3 - <<'EOF'
          import json, re, os
          tag = os.environ['TAG']
          base = os.environ['R2_PUBLIC_BASE'].rstrip('/')
          version = re.sub(r'^v', '', tag)
          manifest = {
              "latest": version,
              "minDbSchema": int(os.environ['MIN_DB_SCHEMA']),
              "changelog": os.environ.get('CHANGELOG', ''),
              "platforms": {
                  "android": {
                      "url": f"{base}/releases/{tag}/{os.environ['ANDROID_FILE']}",
                      "sha256": os.environ['ANDROID_SHA'],
                  },
                  "macos": {
                      "url": f"{base}/releases/{tag}/{os.environ['MACOS_FILE']}",
                      "sha256": os.environ['MACOS_SHA'],
                  },
                  "windows": {
                      "url": f"{base}/releases/{tag}/{os.environ['WINDOWS_FILE']}",
                      "sha256": os.environ['WINDOWS_SHA'],
                  },
              },
              "notes": f"自动构建 v{version}",
          }
          with open('update.json', 'w') as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
          print(open('update.json').read())
          EOF
      - name: Upload update.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # 版本归档
          aws s3 cp update.json \
            "s3://${R2_BUCKET}/releases/${{ needs.validate.outputs.tag }}/update.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "no-cache" \
            --no-progress
          # 根路径覆盖，App 始终检查同一 URL 获取最新版
          aws s3 cp update.json \
            "s3://${R2_BUCKET}/update.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "no-cache" \
            --no-progress
      - name: Verify public update endpoints
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          ANDROID_FILE: ${{ needs.android.outputs.file }}
          MACOS_FILE: ${{ needs.macos.outputs.file }}
          WINDOWS_FILE: ${{ needs.windows.outputs.file }}
        run: |
          base="${R2_PUBLIC_BASE%/}"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "${base}/update.json?release=${TAG}" -o public-update.json
          python3 - <<'EOF'
          import json, os
          manifest = json.load(open('public-update.json'))
          expected = os.environ['TAG'].removeprefix('v')
          if manifest.get('latest') != expected:
              raise SystemExit(
                  f"public update.json latest={manifest.get('latest')!r}, expected={expected!r}"
              )
          EOF
          for file in "${ANDROID_FILE}" "${MACOS_FILE}" "${WINDOWS_FILE}"; do
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --range 0-0 \
              "${base}/releases/${TAG}/${file}" -o /dev/null
          done
          # 首次安装向导包（不参与自更新，仅发布页下载）
          for file in zizai-macos.pkg zizai-windows-setup.exe; do
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --range 0-0 \
              "${base}/releases/${TAG}/${file}" -o /dev/null
          done
      - name: 发布 Release（仅 release notes，二进制在 R2）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
      - name: Sync download site version badge
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          # 下载站 site/index.html 的版本徽章是硬编码占位（update.json 拉取
          # 失败时的兜底展示），发布链路末尾自动与 tag 对齐并推回 main，
          # Cloudflare Pages 随 main push 重新部署；徽章已一致时跳过，
          # 不产生空提交。
          version="${TAG#v}"
          git fetch origin main
          git checkout -B main origin/main
          sed -i "s|<span id=\"ver-chip\">v[0-9][0-9.]* · 最新版</span>|<span id=\"ver-chip\">v${version} · 最新版</span>|" site/index.html
          if git diff --exit-code --quiet -- site/index.html; then
            echo "site badge already v${version}, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "chore(site): sync version badge to v${version}"
          git push origin main
