name: release-build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to package, for example v1.2.0'
        required: true
        type: string

# 只有版本 tag 打包并创建 Release / update.json；普通 commit 只跑 ci.yml。
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  R2_BUCKET: zizai-releases          # ← 改成你的 R2 桶名
  R2_RELEASES_PREFIX: releases       # R2 里的目录前缀

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected version tag like v1.2.0, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify version tag exists
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status === 404) {
                throw new Error(
                  `Version tag "${tag}" does not exist on origin. ` +
                  `Create and push it, then rerun the release: ` +
                  `git tag ${tag} && git push origin ${tag}`,
                );
              }
              throw error;
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Verify pubspec version matches tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          app_version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          tag_version="${TAG#v}"
          if [[ "${app_version}" != "${tag_version}" ]]; then
            echo "pubspec version ${app_version} does not match tag ${TAG}" >&2
            exit 1
          fi

  # ────────────────────────────────────────────
  #  以下 R2 上传步骤统一使用 env 传递密钥：
  #    AWS_ACCESS_KEY_ID     ← secrets.R2_ACCESS_KEY_ID
  #    AWS_SECRET_ACCESS_KEY ← secrets.R2_SECRET_ACCESS_KEY
  #    R2_ENDPOINT           ← secrets.R2_ACCOUNT_ID 拼接
  #  AWS CLI 已预装在 ubuntu/macos/windows runner 中。
  # ────────────────────────────────────────────

  android:
    name: Android APK
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.manifest.outputs.file }}
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - run: flutter pub get
      - name: Build APK
        env:
          UPDATE_URL: ${{ secrets.R2_PUBLIC_BASE }}/update.json
        run: flutter build apk --release --dart-define=UPDATE_URL="${UPDATE_URL}"
      - id: manifest
        name: Compute sha256
        run: |
          sha=$(shasum -a 256 build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "file=app-release.apk" >> "$GITHUB_OUTPUT"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/app-release.apk
        run: |
          aws s3 cp build/app/outputs/flutter-apk/app-release.apk \
            "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

  macos:
    name: macOS .app
    needs: validate
    runs-on: macos-latest
    outputs:
      file: ${{ steps.manifest.outputs.file }}
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - run: flutter pub get
      - name: Build macOS
        env:
          UPDATE_URL: ${{ secrets.R2_PUBLIC_BASE }}/update.json
        run: flutter build macos --release --dart-define=UPDATE_URL="${UPDATE_URL}"
      - name: 打包 zip
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent zi_zai.app zizai-macos.zip
      - name: 打包安装向导 .pkg
        run: tool/installer/macos/build_pkg.sh
      - name: Upload installer pkg to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/zizai-macos.pkg
        run: |
          pkg=$(ls build/installer/zizai-*-macos.pkg)
          aws s3 cp "${pkg}" \
            "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress
      - id: manifest
        name: Compute sha256
        run: |
          sha=$(shasum -a 256 build/macos/Build/Products/Release/zizai-macos.zip | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "file=zizai-macos.zip" >> "$GITHUB_OUTPUT"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/zizai-macos.zip
        run: |
          aws s3 cp build/macos/Build/Products/Release/zizai-macos.zip \
            "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

  windows:
    name: Windows exe
    needs: validate
    runs-on: windows-latest
    outputs:
      file: ${{ steps.manifest.outputs.file }}
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        env:
          UPDATE_URL: ${{ secrets.R2_PUBLIC_BASE }}/update.json
        run: flutter build windows --release --dart-define=UPDATE_URL="${UPDATE_URL}"
      - name: 打包 zip
        run: |
          cd build/windows/x64/runner/Release
          powershell Compress-Archive -Path * -DestinationPath zizai-windows.zip
      - name: 安装 NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: 打包安装向导 setup.exe
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          app_version="${TAG#v}"
          makensis \
            /DAPP_VERSION="${app_version}" \
            /DSOURCE="build/windows/x64/runner/Release" \
            /DICON_SRC="windows/runner/resources/app_icon.ico" \
            tool/installer/windows/zi_zai_installer.nsi
      - name: Upload installer setup.exe to R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/zizai-windows-setup.exe
        run: |
          $exe = (Get-ChildItem 'build/installer/zizai-*-windows-setup.exe').FullName
          aws s3 cp $exe `
            "s3://$env:R2_BUCKET/$env:R2_KEY" `
            --endpoint-url "$env:R2_ENDPOINT" `
            --no-progress
      - id: manifest
        name: Compute sha256 (setup.exe)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem 'build/installer/zizai-*-windows-setup.exe').FullName
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $name = (Get-Item $exe).Name
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "file=$name" >> $env:GITHUB_OUTPUT
      - name: Upload to R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_KEY: ${{ env.R2_RELEASES_PREFIX }}/${{ needs.validate.outputs.tag }}/zizai-windows.zip
        run: |
          aws s3 cp build/windows/x64/runner/Release/zizai-windows.zip `
            "s3://$env:R2_BUCKET/$env:R2_KEY" `
            --endpoint-url "$env:R2_ENDPOINT" `
            --no-progress

  release:
    name: GitHub Release + update.json
    needs: [validate, android, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Generate update.json (URLs point to R2)
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          ANDROID_FILE: ${{ needs.android.outputs.file }}
          ANDROID_SHA: ${{ needs.android.outputs.sha256 }}
          MACOS_FILE: ${{ needs.macos.outputs.file }}
          MACOS_SHA: ${{ needs.macos.outputs.sha256 }}
          WINDOWS_FILE: ${{ needs.windows.outputs.file }}
          WINDOWS_SHA: ${{ needs.windows.outputs.sha256 }}
        run: |
          python3 - <<'EOF'
          import json, re, os
          tag = os.environ['TAG']
          base = os.environ['R2_PUBLIC_BASE'].rstrip('/')
          version = re.sub(r'^v', '', tag)
          manifest = {
              "latest": version,
              "minDbSchema": 2,
              "platforms": {
                  "android": {
                      "url": f"{base}/releases/{tag}/{os.environ['ANDROID_FILE']}",
                      "sha256": os.environ['ANDROID_SHA'],
                  },
                  "macos": {
                      "url": f"{base}/releases/{tag}/{os.environ['MACOS_FILE']}",
                      "sha256": os.environ['MACOS_SHA'],
                  },
                  "windows": {
                      "url": f"{base}/releases/{tag}/{os.environ['WINDOWS_FILE']}",
                      "sha256": os.environ['WINDOWS_SHA'],
                  },
              },
              "notes": f"自动构建 v{version}",
          }
          with open('update.json', 'w') as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
          print(open('update.json').read())
          EOF
      - name: Upload update.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # 版本归档
          aws s3 cp update.json \
            "s3://${R2_BUCKET}/releases/${{ needs.validate.outputs.tag }}/update.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "no-cache" \
            --no-progress
          # 根路径覆盖，App 始终检查同一 URL 获取最新版
          aws s3 cp update.json \
            "s3://${R2_BUCKET}/update.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "no-cache" \
            --no-progress
      - name: Verify public update endpoints
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          ANDROID_FILE: ${{ needs.android.outputs.file }}
          MACOS_FILE: ${{ needs.macos.outputs.file }}
          WINDOWS_FILE: ${{ needs.windows.outputs.file }}
        run: |
          base="${R2_PUBLIC_BASE%/}"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "${base}/update.json?release=${TAG}" -o public-update.json
          python3 - <<'EOF'
          import json, os
          manifest = json.load(open('public-update.json'))
          expected = os.environ['TAG'].removeprefix('v')
          if manifest.get('latest') != expected:
              raise SystemExit(
                  f"public update.json latest={manifest.get('latest')!r}, expected={expected!r}"
              )
          EOF
          for file in "${ANDROID_FILE}" "${MACOS_FILE}" "${WINDOWS_FILE}"; do
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --range 0-0 \
              "${base}/releases/${TAG}/${file}" -o /dev/null
          done
          # 首次安装向导包（不参与自更新，仅发布页下载）
          for file in zizai-macos.pkg zizai-windows-setup.exe; do
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --range 0-0 \
              "${base}/releases/${TAG}/${file}" -o /dev/null
          done
      - name: 发布 Release（仅 release notes，二进制在 R2）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
